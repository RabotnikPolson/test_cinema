server.port=8080
spring.application.name=testCinema

logging.level.com.cinema.testcinema.security=ERROR


spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.username=test_user
spring.datasource.password=pass1

# Hibernate
spring.jpa.hibernate.ddl-auto: validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Kinopoisk Unofficial API key — см. https://kinopoiskapiunofficial.tech
kinopoisk.api.key=${KINOPOISK_API_KEY:3ee92c30-e913-4af0-ba70-9635a086de50}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-min=${JWT_ACCESS_TTL_MIN:30}
app.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:30}

vidsrc.base-url=https://vidsrc-embed.ru
