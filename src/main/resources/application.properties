server.port=8080
spring.config.import=optional:file:.env[.properties]
spring.application.name=testCinema

logging.level.com.cinema.testcinema.security=ERROR


spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.username=test_user
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto: validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Kinopoisk
kinopoisk.api.key=${KINOPOISK_API_KEY}

opensubtitles.api.key=${OPENSUBTITLES_API_KEY}
opensubtitles.username=${OPENSUBTITLES_USERNAME}
opensubtitles.password=${OPENSUBTITLES_PASSWORD}
storage.local.base-path=./storage

# TMDB
tmdb.api.token=${TMDB_API_TOKEN}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-min=${JWT_ACCESS_TTL_MIN:30}
app.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:30}

# MinIO
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket.default=${MINIO_BUCKET_DEFAULT:project-cinema}

# Redis & Cache
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false
spring.cache.type=redis
spring.cache.redis.time-to-live=24h
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
