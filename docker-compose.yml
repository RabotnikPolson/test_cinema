services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: pass1
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: minio-s3
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ── Redis Cache ──
  redis:
    image: redis:7.2-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  # ── AI Recommendation Service (Python) ──
  rec-ai:
    build:
      context: ./rec_ai
    container_name: rec-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USER=test_user
      - DB_PASS=pass1
      - DB_NAME=testdb
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Subtitle Translation Service (Python) ──
  subtitle-translator:
    build:
      context: ./subtitle-translator
    container_name: subtitle-translator
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PRIMARY_PROVIDER=${PRIMARY_PROVIDER:-openai}
      - STORAGE_BASE_PATH=/storage
      - JAVA_WEBHOOK_URL=http://host.docker.internal:8080/api/internal/subtitles/translation-complete
      - INTERNAL_SECRET=change-me-in-prod
    volumes:
      - ./subtitle-translator:/app      # hot-reload: edit .py → auto-restart
      - ./storage:/storage               # shared subtitle files with Java backend
    depends_on:
      - postgres

  # ── Frontend (React + Vite) ──
  frontend:
    build:
      context: ./main-frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./main-frontend/src:/app/src     # hot-reload: edit JSX/CSS → instant HMR
      - ./main-frontend/public:/app/public

volumes:
  pgdata:
  minio_data:
  redis_data:
